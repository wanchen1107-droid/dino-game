<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>小恐龍進化：生存挑戰</title>
    
    <style>
        /* 基礎樣式 */
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background-color: #f7f7f7; 
            font-family: -apple-system, sans-serif;
            overflow: hidden; touch-action: none;
        }

        #game-container { 
            position: relative; 
            width: 100vw; height: 100vh; 
            max-width: 800px; max-height: 400px;
            background-color: white; 
            border-bottom: 3px solid #535353; 
            overflow: hidden; 
        }

        /* 恐龍實體：使用你提供的圖片 */
        #dino { 
            position: absolute; bottom: 0; left: 50px; 
            width: 50px; height: 50px; 
            background-image: url('https://files.oaiusercontent.com/file-K1l9AofY91N6nBNo6rD1Fk8R?se=2024-10-27T10%3A22%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3Dimage_727ac3.png&sig=S%2BWv3B7v9vW6N8l293P25yG8fT4%2BZ58qQz83m09I%2BIY%3D');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }

        /* 進化視覺效果 (不具備無敵功能) */
        #dino.evo-gold { filter: drop-shadow(0 0 8px #FFD700) sepia(0.5) saturate(5); }
        #dino.evo-flame { filter: drop-shadow(0 0 10px #ff4757) hue-rotate(330deg); animation: shake 0.1s infinite; }
        
        @keyframes shake { from { transform: translateY(0); } to { transform: translateY(-2px); } }

        /* 障礙物 */
        .obstacle { position: absolute; bottom: 0; z-index: 5; background-color: #535353; border-radius: 4px; }
        .bird { bottom: 75px; border-radius: 50%; background-color: #757575; }

        /* UI 層 */
        #ui { 
            position: absolute; top: 15px; width: 100%; 
            display: flex; justify-content: space-between; padding: 0 20px; 
            font-weight: bold; color: #535353; z-index: 20;
        }
        #msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            text-align: center; display: none; z-index: 30; 
            background: rgba(255,255,255,0.9); padding: 25px; border-radius: 10px; border: 2px solid #535353;
        }
        .particle { position: absolute; width: 6px; height: 6px; background: #ff6b81; border-radius: 50%; animation: pFly 0.5s forwards; }
        @keyframes pFly { to { opacity: 0; transform: translate(-20px, -30px); } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="evo-status">🐣 幼年恐龍</div>
            <div id="score">SCORE: 00000</div>
        </div>
        <div id="dino"></div>
        <div id="msg">
            <h2 style="margin:0">挑戰失敗</h2>
            <p>點擊畫面重新開始</p>
        </div>
    </div>

<script>
    const container = document.getElementById('game-container');
    const dinoEl = document.getElementById('dino');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('evo-status');
    const msgEl = document.getElementById('msg');

    let isRun = true, score = 0, speed = 5, evo = 'normal';
    let dino = { x: 50, y: 0, vy: 0, w: 40, h: 40, jump: false };
    let obs = [], timer = 0;

    // 跳躍與重啟控制
    const handleAction = (e) => {
        if (e.cancelable) e.preventDefault();
        if (!isRun) { reset(); } 
        else if (!dino.jump) {
            dino.vy = -16; 
            dino.jump = true;
        }
    };

    window.addEventListener('touchstart', handleAction, {passive: false});
    window.addEventListener('mousedown', handleAction);
    window.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') handleAction(e); });

    function gameLoop() {
        if (!isRun) return;

        // 1. 物理引擎
        dino.vy += 0.8;
        dino.y -= dino.vy;
        if (dino.y <= 0) { dino.y = 0; dino.vy = 0; dino.jump = false; }
        dinoEl.style.bottom = dino.y + 'px';

        // 2. 分數計算與難度遞增
        score++;
        let displayScore = Math.floor(score/5);
        scoreEl.innerText = `SCORE: ${displayScore.toString().padStart(5, '0')}`;
        
        // 循序漸進增加速度
        if (score % 600 === 0) speed += 0.25;

        // 進化階段判定 (無敵已取消，僅保留特效)
        if (displayScore >= 1000 && evo !== 'flame') {
            evo = 'flame'; dinoEl.className = 'evo-flame'; 
            statusEl.innerText = '🔥 火焰恐龍 (極速挑戰)';
        } else if (displayScore >= 500 && displayScore < 1000 && evo !== 'gold') {
            evo = 'gold'; dinoEl.className = 'evo-gold'; 
            statusEl.innerText = '✨ 黃金恐龍';
        }

        if (evo === 'flame' && score % 5 === 0) spawnParticle();

        // 3. 障礙物生成與更新
        updateObstacles(displayScore);
        
        // 4. 碰撞偵測 (所有狀態皆會死亡)
        checkCollision();

        requestAnimationFrame(gameLoop);
    }

    function spawnParticle() {
        const p = document.createElement('div'); p.className = 'particle';
        p.style.left = (dino.x + 10)+'px'; p.style.bottom = (dino.y + 10)+'px';
        container.appendChild(p); setTimeout(() => p.remove(), 500);
    }

    function updateObstacles(currentScore) {
        for (let i = obs.length - 1; i >= 0; i--) {
            obs[i].x -= speed;
            obs[i].el.style.left = obs[i].x + 'px';
            if (obs[i].x < -60) { obs[i].el.remove(); obs.splice(i, 1); }
        }

        // 生成頻率控制
        if (++timer > (Math.max(45, 100 - speed * 2.5))) {
            let isBird = Math.random() > 0.8 && currentScore > 400;
            let w = 20 + Math.random()*15, h = isBird ? 25 : 35 + Math.random()*20;
            const el = document.createElement('div');
            el.className = 'obstacle' + (isBird ? ' bird' : '');
            el.style.width = w+'px'; el.style.height = h+'px';
            el.style.left = '100%';
            container.appendChild(el);
            obs.push({ el, x: container.offsetWidth, y: isBird ? 75 : 0, w, h });
            timer = 0;
        }
    }

    function checkCollision() {
        // Hitbox 稍微縮小以求公平感
        let hb = { l: dino.x + 12, r: dino.x + dino.w - 12, t: dino.y + dino.h - 10, b: dino.y + 5 };
        for (let o of obs) {
            if (hb.r > o.x && hb.l < o.x + o.w && hb.t > o.y && hb.b < o.y + o.h) {
                isRun = false; 
                msgEl.style.display = 'block';
            }
        }
    }

    function reset() {
        score = 0; speed = 5; evo = 'normal'; dino.y = 0; dino.vy = 0; isRun = true;
        msgEl.style.display = 'none'; dinoEl.className = ''; 
        statusEl.innerText = '🐣 幼年恐龍';
        obs.forEach(o => o.el.remove()); obs = [];
        gameLoop();
    }

    gameLoop();
</script>
</body>
</html>
